version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: tms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-n3u3da!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tms_db}
      MYSQL_USER: ${MYSQL_USER:-tms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tms_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - tms-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-n3u3da!}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: tms-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-tms_db}
      DB_USER: ${MYSQL_USER:-tms_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-tms_password}
      JWT_SECRET: ${JWT_SECRET:-d83f5e2a7c1b94d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4}
      FRONTEND_URL: http://localhost:8082
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tms-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/api/actuator/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: tms-frontend
    restart: unless-stopped
    ports:
      - "8082:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tms-network

volumes:
  mysql_data:
    driver: local

networks:
  tms-network:
    driver: bridge
